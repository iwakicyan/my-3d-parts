<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coinbox</title>
</head>
<body>
<style>
#eb-wrap { width: 100%; height: 480px; position: relative; border-radius: var(--border-radius-lg); overflow: hidden; background: #e4e8ec; }
#eb-label { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.85); border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #444; line-height: 1.8; font-family: sans-serif; pointer-events: none; min-width: 140px; }
#eb-label .hud-title { font-size: 11px; color: #999; font-weight: bold; letter-spacing: 0.05em; }
#eb-label .hud-list { margin: 2px 0 4px; }
#eb-label .hud-hint { font-size: 11px; color: #aaa; }
#eb-canvas { width: 100%; height: 100%; display: block; }
#wf-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.9); border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: sans-serif; color: #444; }
</style>
<div id="eb-wrap">
  <div id="eb-label">
    <div class="hud-title">オブジェクト一覧</div>
    <div class="hud-list" id="hud-list"><span style="color:#ccc">（なし）</span></div>
    <div class="hud-hint">ドラッグで回転 / スクロールでズーム</div>
  </div>
  <button id="wf-btn">🔲 ワイヤーフレーム ON</button>
  <canvas id="eb-canvas"></canvas>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function() {

const canvas = document.getElementById('eb-canvas');
const wrap = document.getElementById('eb-wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4e8ec);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const sun = new THREE.DirectionalLight(0xfff8f0, 0.6); sun.position.set(5,8,4); sun.castShadow=true; scene.add(sun);
const fill = new THREE.DirectionalLight(0xd0e0ff, 0.4); fill.position.set(-4,2,-3); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshPhongMaterial({color:0xc8ccc8}));
ground.rotation.x=-Math.PI/2; ground.position.y=-5; ground.receiveShadow=true; scene.add(ground);

const allMeshes=[];

const GEO_NAMES={
  IcosahedronGeometry:'二十面体', OctahedronGeometry:'八面体',
  DodecahedronGeometry:'正十二面体', TetrahedronGeometry:'四面体',
  TorusGeometry:'トーラス', TorusKnotGeometry:'トーラスノット',
  ConeGeometry:'円錐', CylinderGeometry:'円柱',
  SphereGeometry:'球', BoxGeometry:'直方体',
  PlaneGeometry:'平面', BufferGeometry:'カスタム',
};
function getLabel(m){
  if(m.name) return m.name;
  if(!m.geometry) return m.type==='Group'?'グループ':m.type;
  const base=GEO_NAMES[m.geometry.type]||m.geometry.type.replace('Geometry','');
  return base+(m.userData.label?' '+m.userData.label:'');
}
const hudList=document.getElementById('hud-list');
let _hudCount=-1;
function updateHUD(){
  _hudCount=allMeshes.length;
  hudList.innerHTML=allMeshes.length
    ?allMeshes.map(m=>`· ${getLabel(m)}`).join('<br>')
    :'<span style="color:#ccc">（なし）</span>';
}

const posV=[],negV=[];
for(let i=-10;i<=10;i++){const arr=i<0?negV:posV;arr.push(i,0,0);arr.push(0,i,0);arr.push(0,0,i);}
const axPosGeo=new THREE.BufferGeometry();
axPosGeo.setAttribute('position',new THREE.Float32BufferAttribute(posV,3));
scene.add(new THREE.Points(axPosGeo,new THREE.PointsMaterial({color:0x000000,size:4,sizeAttenuation:false})));
const axNegGeo=new THREE.BufferGeometry();
axNegGeo.setAttribute('position',new THREE.Float32BufferAttribute(negV,3));
scene.add(new THREE.Points(axNegGeo,new THREE.PointsMaterial({color:0x5070D0,size:4,sizeAttenuation:false})));

let dragging=false,prevX=0,prevY=0,theta=0.5,phi=0.3,R_val=22.0;
const tgt=new THREE.Vector3(0,0,0);
const updateCam=()=>{
  camera.position.set(tgt.x+R_val*Math.sin(theta)*Math.cos(phi),tgt.y+R_val*Math.sin(phi),tgt.z+R_val*Math.cos(theta)*Math.cos(phi));
  camera.lookAt(tgt);
};
updateCam();

canvas.addEventListener("mousedown",e=>{dragging=true;prevX=e.clientX;prevY=e.clientY;});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{if(!dragging)return;theta-=(e.clientX-prevX)*0.007;phi=Math.max(0.05,Math.min(1.2,phi+(e.clientY-prevY)*0.007));prevX=e.clientX;prevY=e.clientY;updateCam();});
canvas.addEventListener("touchstart",e=>{dragging=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;},{passive:true});
window.addEventListener("touchend",()=>dragging=false);
window.addEventListener("touchmove",e=>{if(!dragging)return;theta-=(e.touches[0].clientX-prevX)*0.007;phi=Math.max(0.05,Math.min(1.2,phi+(e.touches[0].clientY-prevY)*0.007));prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;updateCam();},{passive:true});
canvas.addEventListener("wheel",e=>{R_val=Math.max(6,Math.min(60,R_val+e.deltaY*0.02));updateCam();},{passive:true});

let wireframe=false;
const wfBtn=document.getElementById('wf-btn');
function applyWireframe(obj){
  obj.traverse(o=>{
    if(!o.isMesh)return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if('wireframe' in m)m.wireframe=wireframe;});
  });
}
wfBtn.addEventListener('click',()=>{
  wireframe=!wireframe;
  allMeshes.forEach(applyWireframe);
  wfBtn.textContent=wireframe?'🔲 ワイヤーフレーム OFF':'🔲 ワイヤーフレーム ON';
});

// 作業台にオブジェクトを置く（シーン追加 + 一覧登録 + ワイヤーフレーム状態反映）
function addObject(obj){
  scene.add(obj);
  allMeshes.push(obj);
  applyWireframe(obj);
  return obj;
}
function removeObject(obj){
  scene.remove(obj);
  const i=allMeshes.indexOf(obj);
  if(i>=0)allMeshes.splice(i,1);
}
window.workspace={scene,addObject,removeObject,allMeshes,THREE};


// ===== コイン箱（coinbox） =====
// 茶色の四角い台の上に、前が斜めに傾いた金色の箱を載せる。斜めの面に丸い投入口（円盤 + 縦のスロット）
// 原点 = 台の底面の中心、+z が正面、単位 1 = 1m
const COINBOX={
  BASE:{w:0.7,h:0.6,d:0.7},   // 台（幅・高さ・奥行き）
  INSET:0.02,                 // 金の箱を台の縁から内側へ寄せる量
  FRONT_H:0.13,               // 金の箱の正面の垂直な部分の高さ
  H:0.48,                     // 金の箱の高さ
  TOP_D:0.17,                 // 金の箱の天面の奥行き（残りが斜めの面）
  DISC:{r:0.2,t:0.04,seg:12, bowlR:0.08,bowlD:0.03,bowlSeg:10,bowlRot:18,bowlRings:4},   // 投入口の円盤（半径・厚み・周囲の分割数、中心のくぼみの半径・深さ・周囲の分割数・回転[度]・縁から中心への分割数）
  SLOT:{w:0.033,l:0.225},      // 縦のスロット（幅・長さ）
};
const coinboxBaseMat=new THREE.MeshStandardMaterial({color:0x9a8672,roughness:0.9,emissive:0x1e1712});
const coinboxGoldMat=new THREE.MeshStandardMaterial({color:0xe2b862,roughness:0.4,emissive:0x6a4c18});
const coinboxSlotMat=new THREE.MeshBasicMaterial({color:0x000000});   // 光を受けない真っ黒
const coinboxLineMat=new THREE.LineBasicMaterial({color:0x2b3640});

// メッシュ + 輪郭線（edge は線にする角度のしきい値。false で線なし）
function coinboxMesh(geo,mat,edge=20){
  const mesh=new THREE.Mesh(geo,mat);
  mesh.castShadow=true;
  if(edge)mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,edge),coinboxLineMat));
  return mesh;
}

function createCoinbox(){
  const C=COINBOX, B=C.BASE;
  const group=new THREE.Group();
  group.name='コイン箱';

  // 台
  const base=coinboxMesh(new THREE.BoxGeometry(B.w,B.h,B.d),coinboxBaseMat);
  base.position.y=B.h/2;
  group.add(base);

  // 金の箱：横から見た輪郭（[z, y]、z は前が +）を幅方向へ押し出す
  const W=B.w-2*C.INSET, D=B.d-2*C.INSET;
  const zf=D/2, zb=-D/2, zt=zb+C.TOP_D;
  const prof=[[zf,0],[zf,C.FRONT_H],[zt,C.H],[zb,C.H],[zb,0]];
  // Shape は (x, y) 平面。x = -z として押し出し、あとで Y 軸まわりに回して幅を x に向ける
  const shape=new THREE.Shape(prof.map(([z,y])=>new THREE.Vector2(-z,y)));
  const goldGeo=new THREE.ExtrudeGeometry(shape,{depth:W,bevelEnabled:false});
  goldGeo.translate(0,0,-W/2);
  goldGeo.rotateY(Math.PI/2);    // shape の x(= -z) → z、押し出し方向 → x
  const gold=coinboxMesh(goldGeo,coinboxGoldMat);
  gold.position.y=B.h;
  group.add(gold);

  // 斜めの面に沿った座標系：ローカル +z が面の法線、+y が面に沿って上
  const run=zf-zt, rise=C.H-C.FRONT_H, a=Math.atan2(rise,run);
  const face=new THREE.Group();
  face.position.set(0,B.h+(C.FRONT_H+C.H)/2,(zf+zt)/2);
  face.rotation.x=-(Math.PI/2-a);
  group.add(face);

  // 投入口：中心を球面で丸くえぐった円盤 + 縦のスロット（面に沿って上下に向く）
  const dc=C.DISC;
  const sphR=(dc.bowlR*dc.bowlR+dc.bowlD*dc.bowlD)/(2*dc.bowlD);   // くぼみの球の半径
  const bowlZ=r=>r>=dc.bowlR?dc.t:dc.t-dc.bowlD+sphR-Math.sqrt(sphR*sphR-r*r);   // 中心から r の所の表面の高さ（くぼみの外は平ら）
  // 円盤とくぼみで周囲の分割数が違うので、側面・平らな表面・くぼみを別々に作る
  // LatheGeometry の頂点は (r·sinφ, h, r·cosφ)。回転軸 y を面の法線 z へ回すと (r·sinφ, -r·cosφ, h) になる
  // rot は面の法線まわりの回転（ラジアン）
  const ngon=(r,n,rot=0)=>Array.from({length:n},(_,i)=>{const f=i/n*Math.PI*2+rot;return new THREE.Vector2(r*Math.sin(f),-r*Math.cos(f));});
  const lathe=(pts,n,rot=0)=>{
    const geo=new THREE.LatheGeometry(pts,n);   // 下から上へ並べると面が外を向く
    geo.rotateX(Math.PI/2);   // 回転軸 y → 面の法線 z
    geo.rotateZ(rot);
    return geo;
  };
  const bowlRot=THREE.MathUtils.degToRad(dc.bowlRot);
  // 側面（分割の縦線は出さない）
  face.add(coinboxMesh(lathe([new THREE.Vector2(dc.r,0),new THREE.Vector2(dc.r,dc.t)],dc.seg),coinboxGoldMat,45));
  // 平らな表面：外は円盤の多角形、内はくぼみの多角形の穴
  const top=new THREE.Shape(ngon(dc.r,dc.seg));
  top.holes.push(new THREE.Path(ngon(dc.bowlR,dc.bowlSeg,bowlRot)));
  const topGeo=new THREE.ShapeGeometry(top);
  topGeo.translate(0,0,dc.t);
  face.add(coinboxMesh(topGeo,coinboxGoldMat));
  // くぼみ：縁から中心へ下りていく球面
  const bowlProf=[];
  for(let i=dc.bowlRings;i>=0;i--){const r=dc.bowlR*i/dc.bowlRings;bowlProf.push(new THREE.Vector2(r,bowlZ(r)));}
  face.add(coinboxMesh(lathe(bowlProf,dc.bowlSeg,bowlRot),coinboxGoldMat,40));
  // スロットはくぼみの面に沿わせて折った板
  // くぼみは多角形なので、点の向きでの多角形の縁までの距離で r を割り戻してから高さを求める
  const sl=C.SLOT, seg=Math.PI*2/dc.bowlSeg;
  const edgeAt=(x,y)=>{
    const f=Math.atan2(x,-y)-bowlRot;
    const rel=((f%seg)+seg)%seg-seg/2;   // いちばん近い辺の中点からの角度
    return Math.cos(seg/2)/Math.cos(rel);   // 縁までの距離 / bowlR
  };
  const surfZ=(x,y)=>bowlZ(Math.hypot(x,y)/edgeAt(x,y));
  // 折り目はくぼみの各リングを横切る所だけ。縁から外の平らな部分は端まで1枚
  const ys=[-sl.l/2,0,sl.l/2];
  for(let i=1;i<=dc.bowlRings;i++){
    const r=dc.bowlR*i/dc.bowlRings;
    [-1,1].forEach(s=>{const y=s*r*edgeAt(0,s);if(Math.abs(y)<sl.l/2)ys.push(y);});
  }
  ys.sort((a,b)=>a-b);
  const sv=[], si=[];
  ys.forEach((y,j)=>{
    [-sl.w/2,sl.w/2].forEach(x=>sv.push(x,y,surfZ(x,y)+0.003));
    if(j>0)si.push(2*j-2,2*j-1,2*j+1, 2*j-2,2*j+1,2*j);
  });
  const slotGeo=new THREE.BufferGeometry();
  slotGeo.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));
  slotGeo.setIndex(si);
  slotGeo.computeVertexNormals();
  face.add(coinboxMesh(slotGeo,coinboxSlotMat,false));

  group.userData.footprint={halfW:B.w/2,halfD:B.d/2};  // 当たり判定用（ローカル XZ の矩形）
  return group;
}

const SCALE=8;   // 実寸（高さ1.08m）を 8 倍で表示
const coinbox=createCoinbox();
coinbox.scale.setScalar(SCALE);
coinbox.position.set(0,-5,0);
addObject(coinbox);

resize();
window.addEventListener("resize",resize);
(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);if(allMeshes.length!==_hudCount)updateHUD();})();

})();
</script>
</body>
</html>
