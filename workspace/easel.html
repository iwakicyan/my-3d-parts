<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easel</title>
</head>
<body>
<style>
#eb-wrap { width: 100%; height: 480px; position: relative; border-radius: var(--border-radius-lg); overflow: hidden; background: #e4e8ec; }
#eb-label { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.85); border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #444; line-height: 1.8; font-family: sans-serif; pointer-events: none; min-width: 140px; }
#eb-label .hud-title { font-size: 11px; color: #999; font-weight: bold; letter-spacing: 0.05em; }
#eb-label .hud-list { margin: 2px 0 4px; }
#eb-label .hud-hint { font-size: 11px; color: #aaa; }
#eb-canvas { width: 100%; height: 100%; display: block; }
#wf-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.9); border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: sans-serif; color: #444; }
</style>
<div id="eb-wrap">
  <div id="eb-label">
    <div class="hud-title">オブジェクト一覧</div>
    <div class="hud-list" id="hud-list"><span style="color:#ccc">（なし）</span></div>
    <div class="hud-hint">ドラッグで回転 / スクロールでズーム</div>
  </div>
  <button id="wf-btn">🔲 ワイヤーフレーム ON</button>
  <canvas id="eb-canvas"></canvas>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function() {

const canvas = document.getElementById('eb-canvas');
const wrap = document.getElementById('eb-wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4e8ec);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const sun = new THREE.DirectionalLight(0xfff8f0, 0.6); sun.position.set(5,8,4); sun.castShadow=true; scene.add(sun);
const fill = new THREE.DirectionalLight(0xd0e0ff, 0.4); fill.position.set(-4,2,-3); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshPhongMaterial({color:0xc8ccc8}));
ground.rotation.x=-Math.PI/2; ground.position.y=-5; ground.receiveShadow=true; scene.add(ground);

const allMeshes=[];

const GEO_NAMES={
  IcosahedronGeometry:'二十面体', OctahedronGeometry:'八面体',
  DodecahedronGeometry:'正十二面体', TetrahedronGeometry:'四面体',
  TorusGeometry:'トーラス', TorusKnotGeometry:'トーラスノット',
  ConeGeometry:'円錐', CylinderGeometry:'円柱',
  SphereGeometry:'球', BoxGeometry:'直方体',
  PlaneGeometry:'平面', BufferGeometry:'カスタム',
};
function getLabel(m){
  if(m.name) return m.name;
  if(!m.geometry) return m.type==='Group'?'グループ':m.type;
  const base=GEO_NAMES[m.geometry.type]||m.geometry.type.replace('Geometry','');
  return base+(m.userData.label?' '+m.userData.label:'');
}
const hudList=document.getElementById('hud-list');
let _hudCount=-1;
function updateHUD(){
  _hudCount=allMeshes.length;
  hudList.innerHTML=allMeshes.length
    ?allMeshes.map(m=>`· ${getLabel(m)}`).join('<br>')
    :'<span style="color:#ccc">（なし）</span>';
}

const posV=[],negV=[];
for(let i=-10;i<=10;i++){const arr=i<0?negV:posV;arr.push(i,0,0);arr.push(0,i,0);arr.push(0,0,i);}
const axPosGeo=new THREE.BufferGeometry();
axPosGeo.setAttribute('position',new THREE.Float32BufferAttribute(posV,3));
scene.add(new THREE.Points(axPosGeo,new THREE.PointsMaterial({color:0x000000,size:4,sizeAttenuation:false})));
const axNegGeo=new THREE.BufferGeometry();
axNegGeo.setAttribute('position',new THREE.Float32BufferAttribute(negV,3));
scene.add(new THREE.Points(axNegGeo,new THREE.PointsMaterial({color:0x5070D0,size:4,sizeAttenuation:false})));

let dragging=false,prevX=0,prevY=0,theta=0.5,phi=0.3,R_val=22.0;
const tgt=new THREE.Vector3(0,0,0);
const updateCam=()=>{
  camera.position.set(tgt.x+R_val*Math.sin(theta)*Math.cos(phi),tgt.y+R_val*Math.sin(phi),tgt.z+R_val*Math.cos(theta)*Math.cos(phi));
  camera.lookAt(tgt);
};
updateCam();

canvas.addEventListener("mousedown",e=>{dragging=true;prevX=e.clientX;prevY=e.clientY;});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{if(!dragging)return;theta-=(e.clientX-prevX)*0.007;phi=Math.max(0.05,Math.min(1.2,phi+(e.clientY-prevY)*0.007));prevX=e.clientX;prevY=e.clientY;updateCam();});
canvas.addEventListener("touchstart",e=>{dragging=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;},{passive:true});
window.addEventListener("touchend",()=>dragging=false);
window.addEventListener("touchmove",e=>{if(!dragging)return;theta-=(e.touches[0].clientX-prevX)*0.007;phi=Math.max(0.05,Math.min(1.2,phi+(e.touches[0].clientY-prevY)*0.007));prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;updateCam();},{passive:true});
canvas.addEventListener("wheel",e=>{R_val=Math.max(6,Math.min(60,R_val+e.deltaY*0.02));updateCam();},{passive:true});

let wireframe=false;
const wfBtn=document.getElementById('wf-btn');
function applyWireframe(obj){
  obj.traverse(o=>{
    if(!o.isMesh)return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if('wireframe' in m)m.wireframe=wireframe;});
  });
}
wfBtn.addEventListener('click',()=>{
  wireframe=!wireframe;
  allMeshes.forEach(applyWireframe);
  wfBtn.textContent=wireframe?'🔲 ワイヤーフレーム OFF':'🔲 ワイヤーフレーム ON';
});

// 作業台にオブジェクトを置く（シーン追加 + 一覧登録 + ワイヤーフレーム状態反映）
function addObject(obj){
  scene.add(obj);
  allMeshes.push(obj);
  applyWireframe(obj);
  return obj;
}
function removeObject(obj){
  scene.remove(obj);
  const i=allMeshes.indexOf(obj);
  if(i>=0)allMeshes.splice(i,1);
}
window.workspace={scene,addObject,removeObject,allMeshes,THREE};


// ===== イーゼル（easel） =====
// 前の脚2本を「ハ」の字に開き（下半分は少し外へしなる）、その間の中央に柱（マスト）を立てる
// マストは前の脚より上へ出て、下は棚（下の横木）の下端で止まる。上の横木の高さでマストの背面から後ろの脚を奥へ開いて立てる
// 前の脚とマストに横木を2本渡す：上は脚の間、下はキャンバスを載せる棚で脚より外へはみ出す
// 棚に絵を貼ったキャンバスを載せ、上の横木に立てかける（image: 絵の画像 URL。null ならキャンバスなし）
// 原点 = 足元の中心（前の脚の足先を結ぶ線の真ん中から少し後ろ）、+z が正面、単位 1 = 1m
const EASEL={
  FRONT_H:1.6,          // 前の脚の高さ
  FRONT_TOP_X:0.267,    // 前の脚の頭の x（中心から）
  FRONT_BOT_X:0.467,    // 前の脚の足先の x
  LEAN:0.2,             // 前の脚の足先が頭より前(+z)へ出る量
  BOW:0.025,            // 前の脚の下半分のしなり（外へ）
  MAST_H:1.7,           // マストの頭の高さ
  REAR_BOT_Z:-0.6,      // 後ろの脚の足先の z
  LEG_W:0.09, LEG_T:0.04,             // 脚の幅・厚み
  BAR_H:0.1, BAR_T:0.035,             // 上の横木の高さ・厚み
  BAR_Y:1.385,                        // 上の横木の中心の高さ
  SHELF_Y:0.745, SHELF_W:0.94,        // 棚の中心の高さ・長さ
  SHELF_H:0.1, SHELF_D:0.08,          // 棚の高さ・奥行き
  CANVAS:0.62, CANVAS_T:0.03,         // キャンバスの一辺・厚み（正方形）
};
const easelMat=new THREE.MeshStandardMaterial({color:0xa08766,roughness:0.85});
const easelLineMat=new THREE.LineBasicMaterial({color:0x161616});

function easelMesh(geo){
  const mesh=new THREE.Mesh(geo,easelMat);
  mesh.castShadow=true;   // 自分の影は受けない（看板・柵と同じ）
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,15),easelLineMat));   // しなりの分割線は出さない
  return mesh;
}

// p0（下端）→ p1（上端）の角材。bow(t) で t（0=下端〜1=上端）ごとにローカル x へずらしてしならせる
function easelBeam(p0,p1,w,t,bow){
  const dir=p1.clone().sub(p0), L=dir.length();
  dir.normalize();
  const geo=new THREE.BoxGeometry(w,L,t,1,bow?16:1,1);
  if(bow){
    const pos=geo.attributes.position;
    for(let i=0;i<pos.count;i++)pos.setX(i,pos.getX(i)+bow(pos.getY(i)/L+0.5));
    geo.computeVertexNormals();
  }
  const x=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,0,1)).normalize();
  const z=new THREE.Vector3().crossVectors(x,dir);
  const mesh=easelMesh(geo);
  mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,dir,z));
  mesh.position.copy(p0).add(p1).multiplyScalar(0.5);
  return mesh;
}

function createEasel({image=EASEL_IMAGE}={}){
  const E=EASEL;
  const group=new THREE.Group();
  group.name='イーゼル';

  // 前の脚の面：高さ y での脚の中心の x と z
  const legX=y=>E.FRONT_BOT_X+(E.FRONT_TOP_X-E.FRONT_BOT_X)*y/E.FRONT_H;
  const legZ=y=>E.LEAN*(1-y/E.FRONT_H);
  const tilt=-Math.atan2(E.LEAN,E.FRONT_H);   // 前の脚の面の傾き（上ほど奥）

  // 前の脚。下半分（棚より下）だけ外へしなる
  const tb=E.SHELF_Y/E.FRONT_H;
  [-1,1].forEach(side=>{
    const bow=t=>t<tb?side*E.BOW*Math.sin(Math.PI*t/tb):0;
    group.add(easelBeam(
      new THREE.Vector3(side*E.FRONT_BOT_X,0,legZ(0)),
      new THREE.Vector3(side*E.FRONT_TOP_X,E.FRONT_H,legZ(E.FRONT_H)),
      E.LEG_W,E.LEG_T,bow));
  });

  // マスト（前の脚と同じ面）。下端は棚の下端に揃える
  const mastFoot=E.SHELF_Y-E.SHELF_H/2;
  group.add(easelBeam(
    new THREE.Vector3(0,mastFoot,legZ(mastFoot)),
    new THREE.Vector3(0,E.MAST_H,legZ(E.MAST_H)),
    E.LEG_W,E.LEG_T));

  // 後ろの脚（上の横木の高さでマストの背面に当て、奥へ。頭は横木の上端に揃える。正面からはマストに隠れる）
  const rearTopY=E.BAR_Y+E.BAR_H/2;
  group.add(easelBeam(
    new THREE.Vector3(0,0,E.REAR_BOT_Z),
    new THREE.Vector3(0,rearTopY,legZ(rearTopY)-E.LEG_T),
    E.LEG_W*0.8,E.LEG_T));

  // 横木（前の脚とマストの前の面に付ける）
  const bar=(len,h,d,y)=>{
    const m=easelMesh(new THREE.BoxGeometry(len,h,d));
    m.rotation.x=tilt;
    m.position.set(0,y,legZ(y)+E.LEG_T/2+d/2);
    group.add(m);
  };
  bar(2*legX(E.BAR_Y),E.BAR_H,E.BAR_T,E.BAR_Y);        // 上：脚の中心から中心まで
  bar(E.SHELF_W,E.SHELF_H,E.SHELF_D,E.SHELF_Y);       // 下：キャンバスを載せる棚

  // キャンバス：棚の上に載せ、背面を上の横木の前の面に当てる。絵は正面(+z)だけ、ほかの面は生成りの布
  if(image){
    const C=E.CANVAS, T=E.CANVAS_T;
    const tex=new THREE.TextureLoader().load(image);
    tex.colorSpace=THREE.SRGBColorSpace;
    tex.anisotropy=4;
    const cloth=new THREE.MeshStandardMaterial({color:0xf2ede2,roughness:0.95});
    // 照明でくすまないよう、絵は少し自ら光らせて元の色に近づける
    const art=new THREE.MeshStandardMaterial({map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:0.45,roughness:0.9});
    const geo=new THREE.BoxGeometry(C,C,T);
    const canvas=new THREE.Mesh(geo,[cloth,cloth,cloth,cloth,art,cloth]);   // +x,-x,+y,-y,+z,-z
    canvas.castShadow=true;
    canvas.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),easelLineMat));
    // 傾いた面に沿って、下端が棚の上面に載る位置へ
    const yBottom=E.SHELF_Y+E.SHELF_H/2;
    const up=new THREE.Vector3(0,Math.cos(tilt),Math.sin(tilt));    // 面に沿った上向き
    const fwd=new THREE.Vector3(0,-Math.sin(tilt),Math.cos(tilt));  // 面の正面向き
    const base=new THREE.Vector3(0,yBottom,legZ(yBottom)+E.LEG_T/2+E.BAR_T);   // 横木の前の面の高さ yBottom の点
    canvas.position.copy(base).addScaledVector(up,C/2).addScaledVector(fwd,T/2);
    canvas.rotation.x=tilt;
    canvas.name='キャンバス';
    group.userData.canvas=canvas;
    group.add(canvas);
  }

  group.userData.footprint={halfW:E.FRONT_BOT_X+E.LEG_W/2,halfD:Math.max(E.LEAN,-E.REAR_BOT_Z)+E.LEG_T};  // 当たり判定用（ローカル XZ の矩形）
  return group;
}

const SCALE=4;   // 実寸（高さ1.7m）を 4 倍で表示
const easel=createEasel();
easel.scale.setScalar(SCALE);
easel.position.set(0,-5,0);
addObject(easel);

resize();
window.addEventListener("resize",resize);
(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);if(allMeshes.length!==_hudCount)updateHUD();})();

})();
