<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SShall</title>
</head>
<body>
<style>
#eb-wrap { width: 100%; height: 480px; position: relative; border-radius: var(--border-radius-lg); overflow: hidden; background: #e4e8ec; }
#eb-label { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.85); border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #444; line-height: 1.8; font-family: sans-serif; pointer-events: none; min-width: 140px; }
#eb-label .hud-title { font-size: 11px; color: #999; font-weight: bold; letter-spacing: 0.05em; }
#eb-label .hud-list { margin: 2px 0 4px; }
#eb-label .hud-hint { font-size: 11px; color: #aaa; }
#eb-canvas { width: 100%; height: 100%; display: block; }
#wf-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.9); border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: sans-serif; color: #444; }
</style>
<div id="eb-wrap">
  <div id="eb-label">
    <div class="hud-title">オブジェクト一覧</div>
    <div class="hud-list" id="hud-list"><span style="color:#ccc">（なし）</span></div>
    <div class="hud-hint">ドラッグで回転 / スクロールでズーム</div>
  </div>
  <button id="wf-btn">🔲 ワイヤーフレーム ON</button>
  <canvas id="eb-canvas"></canvas>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function() {

const canvas = document.getElementById('eb-canvas');
const wrap = document.getElementById('eb-wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4e8ec);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const sun = new THREE.DirectionalLight(0xfff8f0, 0.6); sun.position.set(5,8,4); sun.castShadow=true; scene.add(sun);
const fill = new THREE.DirectionalLight(0xd0e0ff, 0.4); fill.position.set(-4,2,-3); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshPhongMaterial({color:0xc8ccc8}));
ground.rotation.x=-Math.PI/2; ground.position.y=-5; ground.receiveShadow=true; scene.add(ground);

const allMeshes=[];

const GEO_NAMES={
  IcosahedronGeometry:'二十面体', OctahedronGeometry:'八面体',
  DodecahedronGeometry:'正十二面体', TetrahedronGeometry:'四面体',
  TorusGeometry:'トーラス', TorusKnotGeometry:'トーラスノット',
  ConeGeometry:'円錐', CylinderGeometry:'円柱',
  SphereGeometry:'球', BoxGeometry:'直方体',
  PlaneGeometry:'平面', BufferGeometry:'カスタム',
};
function getLabel(m){
  if(m.name) return m.name;
  if(!m.geometry) return m.type==='Group'?'グループ':m.type;
  const base=GEO_NAMES[m.geometry.type]||m.geometry.type.replace('Geometry','');
  return base+(m.userData.label?' '+m.userData.label:'');
}
const hudList=document.getElementById('hud-list');
let _hudCount=-1;
function updateHUD(){
  _hudCount=allMeshes.length;
  hudList.innerHTML=allMeshes.length
    ?allMeshes.map(m=>`· ${getLabel(m)}`).join('<br>')
    :'<span style="color:#ccc">（なし）</span>';
}

const posV=[],negV=[];
for(let i=-10;i<=10;i++){const arr=i<0?negV:posV;arr.push(i,0,0);arr.push(0,i,0);arr.push(0,0,i);}
const axPosGeo=new THREE.BufferGeometry();
axPosGeo.setAttribute('position',new THREE.Float32BufferAttribute(posV,3));
scene.add(new THREE.Points(axPosGeo,new THREE.PointsMaterial({color:0x000000,size:4,sizeAttenuation:false})));
const axNegGeo=new THREE.BufferGeometry();
axNegGeo.setAttribute('position',new THREE.Float32BufferAttribute(negV,3));
scene.add(new THREE.Points(axNegGeo,new THREE.PointsMaterial({color:0x5070D0,size:4,sizeAttenuation:false})));

let dragging=false,prevX=0,prevY=0,theta=0.5,phi=0.3,R_val=17.0;
const tgt=new THREE.Vector3(-0.7,2.5,0.5);
const updateCam=()=>{
  camera.position.set(tgt.x+R_val*Math.sin(theta)*Math.cos(phi),tgt.y+R_val*Math.sin(phi),tgt.z+R_val*Math.cos(theta)*Math.cos(phi));
  camera.lookAt(tgt);
};
updateCam();

canvas.addEventListener("mousedown",e=>{dragging=true;prevX=e.clientX;prevY=e.clientY;});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("mousemove",e=>{if(!dragging)return;theta-=(e.clientX-prevX)*0.007;phi=Math.max(0.05,Math.min(1.2,phi+(e.clientY-prevY)*0.007));prevX=e.clientX;prevY=e.clientY;updateCam();});
canvas.addEventListener("touchstart",e=>{dragging=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;},{passive:true});
window.addEventListener("touchend",()=>dragging=false);
window.addEventListener("touchmove",e=>{if(!dragging)return;theta-=(e.touches[0].clientX-prevX)*0.007;phi=Math.max(0.05,Math.min(1.2,phi+(e.touches[0].clientY-prevY)*0.007));prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;updateCam();},{passive:true});
canvas.addEventListener("wheel",e=>{R_val=Math.max(6,Math.min(60,R_val+e.deltaY*0.02));updateCam();},{passive:true});

let wireframe=false;
const wfBtn=document.getElementById('wf-btn');
function applyWireframe(obj){
  obj.traverse(o=>{
    if(!o.isMesh)return;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if('wireframe' in m)m.wireframe=wireframe;});
  });
}
wfBtn.addEventListener('click',()=>{
  wireframe=!wireframe;
  allMeshes.forEach(applyWireframe);
  wfBtn.textContent=wireframe?'🔲 ワイヤーフレーム OFF':'🔲 ワイヤーフレーム ON';
});

// 作業台にオブジェクトを置く（シーン追加 + 一覧登録 + ワイヤーフレーム状態反映）
function addObject(obj){
  scene.add(obj);
  allMeshes.push(obj);
  applyWireframe(obj);
  return obj;
}
function removeObject(obj){
  scene.remove(obj);
  const i=allMeshes.indexOf(obj);
  if(i>=0)allMeshes.splice(i,1);
}
window.workspace={scene,addObject,removeObject,allMeshes,THREE};

// ===== SShall =====
// 円筒の塔の手前に正面の棟（アーチの両開き扉）、奥の右に別の棟を付けた建物
// 屋根は紫の寄棟（塔は円錐）、壁はクリーム色、足元にグレーの基壇
// 原点 = 塔の中心の地面、+z が正面（扉の向き）、単位 1 = 1m
const SSHALL={
  PLINTH:{h:0.4,out:0.08},    // 基壇（高さ・壁からのはみ出し）
  FRONT:{x0:-4.45,x1:1.5,z0:0,z1:3.6,h:3.4},   // 正面の棟の壁（x/z の範囲・壁の高さ）
  BACK:{x0:-1.6,x1:3.1,z0:-2.4,z1:0.3,h:3.4},    // 奥の棟の壁
  ROOF:{over:0.35,t:0.22,pitch:15},            // 寄棟屋根（軒の出・軒の厚み・勾配[度]）
  TOWER:{r:2.0,h:6.0,seg:12, roofR:2.55,roofH:1.5},   // 塔（半径・壁の高さ・分割数、円錐屋根の半径・高さ）
  WIN:{n:4,arc:58,top:0.75,h:0.65,rot:15,frame:0.1,out:0.07},   // 塔の窓（数・弧の角度[度]・上端の壁の上からの距離・高さ・回転[度]・枠の幅・枠の出）
  DOOR:{w:1.7,h:2.55,t:0.08},   // 扉（幅・アーチの頂点までの高さ・厚み）
  STEP:{w:2.7,d:0.9},    // 扉の前の段（高さは基壇と同じ）
};

function createSShall(){
  const C=SSHALL, P=C.PLINTH, F=C.FRONT, B=C.BACK, R=C.ROOF, T=C.TOWER;
  const group=new THREE.Group();
  group.name='SShall';

  const wallMat=new THREE.MeshStandardMaterial({color:0xf7f1e3,roughness:0.9,emissive:0x6a6556});
  const plinthMat=new THREE.MeshStandardMaterial({color:0x8f9e9c,roughness:0.9,emissive:0x262c2c});
  const roofMat=new THREE.MeshStandardMaterial({color:0x7a6692,roughness:0.8,flatShading:true,emissive:0x221a2e});
  const doorMat=new THREE.MeshStandardMaterial({color:0x8a6a48,roughness:0.8,emissive:0x2a1e12});
  const frameMat=new THREE.MeshStandardMaterial({color:0x7a5a3a,roughness:0.8,emissive:0x22180e});
  const darkMat=new THREE.MeshStandardMaterial({color:0x2c2a33,roughness:1});
  const lineMat=new THREE.LineBasicMaterial({color:0x2f3448});

  // メッシュ + 輪郭線（edge は線にする角度のしきい値。false で線なし）
  const add=(geo,mat,edge=20,parent=group)=>{
    const m=new THREE.Mesh(geo,mat);
    m.castShadow=true; m.receiveShadow=true;
    if(edge)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,edge),lineMat));
    parent.add(m);
    return m;
  };
  const box=(x0,x1,y0,y1,z0,z1,mat)=>{
    const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);
    g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
    return add(g,mat);
  };

  // 寄棟屋根：軒の板 + 低い勾配の寄棟（棟は長い辺の向き）
  const hipRoof=(x0,x1,z0,z1,y)=>{
    x0-=R.over; x1+=R.over; z0-=R.over; z1+=R.over;
    box(x0,x1,y,y+R.t,z0,z1,roofMat);
    const yb=y+R.t, alongX=(x1-x0)>=(z1-z0);
    const half=(alongX?z1-z0:x1-x0)/2;
    const yr=yb+half*Math.tan(THREE.MathUtils.degToRad(R.pitch));
    const cx=(x0+x1)/2, cz=(z0+z1)/2;
    // 棟の両端
    const r0=alongX?[x0+half,yr,cz]:[cx,yr,z0+half];
    const r1=alongX?[x1-half,yr,cz]:[cx,yr,z1-half];
    const c=[[x0,yb,z1],[x1,yb,z1],[x1,yb,z0],[x0,yb,z0]];   // 手前左から反時計回り（上から見て）
    const pos=[], tri=(a,b,d)=>pos.push(...a,...b,...d);
    if(alongX){
      tri(c[0],c[1],r1); tri(c[0],r1,r0);   // 手前
      tri(c[2],c[3],r0); tri(c[2],r0,r1);   // 奥
      tri(c[1],c[2],r1);                    // 右
      tri(c[3],c[0],r0);                    // 左
    }else{
      tri(c[1],c[2],r0); tri(c[1],r0,r1);   // 右
      tri(c[3],c[0],r1); tri(c[3],r1,r0);   // 左
      tri(c[0],c[1],r1);                    // 手前
      tri(c[2],c[3],r0);                    // 奥
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.computeVertexNormals();
    add(g,roofMat);
  };

  // 棟：基壇 + 壁 + 屋根
  [F,B].forEach(b=>{
    box(b.x0-P.out,b.x1+P.out,0,P.h,b.z0-P.out,b.z1+P.out,plinthMat);
    box(b.x0,b.x1,P.h,b.h,b.z0,b.z1,wallMat);
    hipRoof(b.x0,b.x1,b.z0,b.z1,b.h);
  });

  // 塔：基壇 + 円筒 + 円錐屋根
  const cyl=(r,y0,y1,mat,edge=35)=>{   // 分割の縦線は出さない
    const g=new THREE.CylinderGeometry(r,r,y1-y0,T.seg);
    g.translate(0,(y0+y1)/2,0);
    return add(g,mat,edge);
  };
  cyl(T.r+P.out,0,P.h,plinthMat);
  cyl(T.r,P.h,T.h,wallMat);
  const roofGeo=new THREE.ConeGeometry(T.roofR,T.roofH,T.seg);
  roofGeo.translate(0,T.h+T.roofH/2,0);
  add(roofGeo,new THREE.MeshStandardMaterial({color:0x7a6692,roughness:0.8,emissive:0x221a2e}),35);
  // 円錐の軒の厚み
  cyl(T.roofR,T.h-R.t,T.h,roofMat);

  // 塔の窓：暗い横長の開口 + 茶色の枠（円弧の板を縦に押し出す）
  // 角度 a は +z（正面）から +x へ回る向き。Shape の (x, y) → ワールド (x, -z)
  // 円筒と同じ T.seg 角形に沿わせる（r は角の頂点までの距離）。分割の角でだけ折れる
  const step=Math.PI*2/T.seg;
  const ring=(r,a0,a1)=>{
    const as=[a0];
    for(let k=Math.floor(a0/step)+1;k*step<a1;k++)as.push(k*step);
    as.push(a1);
    return as.map(a=>{
      const rel=((a%step)+step)%step-step/2;   // いちばん近い辺の中点からの角度
      const d=r*Math.cos(step/2)/Math.cos(rel);
      return new THREE.Vector2(d*Math.sin(a),-d*Math.cos(a));
    });
  };
  const arcSlab=(r0,r1,a0,a1,y0,y1,mat,edge=35)=>{
    const s=new THREE.Shape([...ring(r1,a0,a1),...ring(r0,a0,a1).reverse()]);
    const g=new THREE.ExtrudeGeometry(s,{depth:y1-y0,bevelEnabled:false});
    g.rotateX(-Math.PI/2);   // 押し出し方向 → +y、shape の y → -z
    g.translate(0,y0,0);
    return add(g,mat,edge);
  };
  const W=C.WIN, wy1=T.h-W.top, wy0=wy1-W.h;
  for(let i=0;i<W.n;i++){
    const ac=THREE.MathUtils.degToRad(W.rot+i*360/W.n), ha=THREE.MathUtils.degToRad(W.arc/2);
    const a0=ac-ha, a1=ac+ha, fa=W.frame/T.r;   // 枠の幅を角度に
    arcSlab(T.r-0.02,T.r+0.01,a0,a1,wy0,wy1,darkMat,false);                       // 開口
    arcSlab(T.r-0.02,T.r+W.out,a0-fa,a1+fa,wy1,wy1+W.frame*1.4,frameMat);         // 上の枠（少し厚い）
    arcSlab(T.r-0.02,T.r+W.out,a0-fa,a1+fa,wy0-W.frame,wy0,frameMat);             // 下の枠
    arcSlab(T.r-0.02,T.r+W.out,a0-fa,a0,wy0,wy1,frameMat);                        // 左の枠
    arcSlab(T.r-0.02,T.r+W.out,a1,a1+fa,wy0,wy1,frameMat);                        // 右の枠
  }

  // 扉：正面の壁の真ん中にアーチ形の両開き（左右の扉板 + 丸い取っ手）
  const D=C.DOOR, dr=D.w/2, ds=D.h-dr-P.h, dx=(F.x0+F.x1)/2;
  const leaf=s=>{   // s=-1 左、+1 右
    const sh=new THREE.Shape();
    sh.moveTo(0,0); sh.lineTo(s*dr,0); sh.lineTo(s*dr,ds);
    if(s>0)sh.absarc(0,ds,dr,0,Math.PI/2,false);
    else sh.absarc(0,ds,dr,Math.PI,Math.PI/2,true);
    sh.lineTo(0,0);
    const g=new THREE.ExtrudeGeometry(sh,{depth:D.t,bevelEnabled:false,curveSegments:2});
    g.translate(dx,P.h,F.z1-D.t/2);
    add(g,doorMat,30);
  };
  leaf(-1); leaf(1);
  [-1,1].forEach(s=>{
    const g=new THREE.TorusGeometry(0.105,0.027,4,8);
    g.translate(dx+s*0.18,P.h+1.05,F.z1+D.t/2+0.03);
    add(g,darkMat,false);
  });

  // 扉の前の段
  const S=C.STEP;
  box(dx-S.w/2,dx+S.w/2,0,P.h,F.z1+P.out,F.z1+P.out+S.d,plinthMat);

  return group;
}
addObject(createSShall());


resize();
window.addEventListener("resize",resize);
(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);if(allMeshes.length!==_hudCount)updateHUD();})();

})();
</script>
</body>
</html>
